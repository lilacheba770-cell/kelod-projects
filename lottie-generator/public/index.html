<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מחולל אנימציות לוטי</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f0f1a;
      color: #e0e0ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #888;
      margin-bottom: 40px;
      font-size: 0.95rem;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #a0a0c0;
    }

    textarea {
      width: 100%;
      height: 90px;
      background: #0f0f1a;
      border: 1px solid #333355;
      border-radius: 10px;
      color: #e0e0ff;
      font-size: 1rem;
      padding: 12px;
      resize: vertical;
      outline: none;
      font-family: inherit;
      direction: rtl;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: #a78bfa; }

    /* ── Image Upload ── */
    .upload-area {
      margin-top: 18px;
    }

    .drop-zone {
      border: 2px dashed #333366;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      background: #0f0f1a;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #a78bfa;
      background: #13132a;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-zone-text {
      color: #6060a0;
      font-size: 0.88rem;
      pointer-events: none;
    }

    .drop-zone-text span {
      color: #a78bfa;
    }

    .image-preview-wrap {
      display: none;
      position: relative;
      margin-top: 10px;
    }

    .image-preview-wrap img {
      width: 100%;
      max-height: 200px;
      object-fit: contain;
      border-radius: 10px;
      border: 1px solid #2a2a4a;
      background: #0f0f1a;
    }

    .remove-img {
      position: absolute;
      top: 6px;
      left: 6px;
      background: #3a1a2e;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .img-badge {
      display: inline-block;
      margin-top: 6px;
      background: #1e1e3a;
      border: 1px solid #4a3a7a;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.78rem;
      color: #a78bfa;
    }

    /* ── Examples ── */
    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .example-chip {
      background: #1e1e3a;
      border: 1px solid #333366;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #a0a0d0;
      transition: all 0.2s;
    }

    .example-chip:hover {
      background: #2a2a5a;
      border-color: #a78bfa;
      color: #e0e0ff;
    }

    button#generateBtn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button#generateBtn:hover { opacity: 0.9; }
    button#generateBtn:active { transform: scale(0.98); }
    button#generateBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      display: none;
      margin: 30px auto;
      width: 44px;
      height: 44px;
      border: 3px solid #2a2a4a;
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .result-area {
      margin-top: 32px;
      width: 100%;
      max-width: 560px;
      display: none;
    }

    .preview-card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }

    #lottie-container {
      width: 300px;
      height: 300px;
      margin: 0 auto 20px;
      background: #0f0f1a;
      border-radius: 12px;
      overflow: hidden;
    }

    .action-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px solid #333366;
      background: #1e1e3a;
      color: #a0a0d0;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #2a2a5a;
      color: #fff;
      border-color: #a78bfa;
    }

    .error-msg {
      background: #2a0f1a;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      border-radius: 10px;
      padding: 14px;
      margin-top: 20px;
      font-size: 0.9rem;
      display: none;
    }

    .json-section {
      margin-top: 20px;
      text-align: right;
    }

    .json-toggle {
      background: none;
      border: none;
      color: #a78bfa;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0;
    }

    pre {
      background: #0f0f1a;
      border: 1px solid #222244;
      border-radius: 8px;
      padding: 12px;
      overflow: auto;
      max-height: 300px;
      font-size: 0.75rem;
      color: #a0ffa0;
      text-align: left;
      direction: ltr;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>מחולל אנימציות לוטי</h1>
  <p class="subtitle">תאר אנימציה בעברית או באנגלית — Claude ייצר עבורך קובץ Lottie JSON</p>

  <div class="card">
    <label for="desc">תיאור האנימציה:</label>
    <textarea id="desc" placeholder="לדוגמה: כדור כתום קופץ למעלה ולמטה..."></textarea>

    <!-- Image Upload -->
    <div class="upload-area">
      <label>תמונת רפרנס <span style="color:#555;font-size:0.8rem">(אופציונלי — עוזר ל-Claude להבין את הסגנון)</span></label>
      <div class="drop-zone" id="dropZone">
        <input type="file" id="imageInput" accept="image/*" onchange="handleImageFile(this.files[0])" />
        <div class="drop-zone-text">גרור תמונה לכאן או <span>לחץ לבחירה</span></div>
      </div>
      <div class="image-preview-wrap" id="previewWrap">
        <img id="previewImg" src="" alt="רפרנס" />
        <button class="remove-img" onclick="removeImage()" title="הסר תמונה">✕</button>
      </div>
      <div id="imgBadge" style="display:none">
        <span class="img-badge">📷 תמונת רפרנס צורפה</span>
      </div>
    </div>

    <div class="examples">
      <span class="example-chip" onclick="setExample(this)">לב פועם</span>
      <span class="example-chip" onclick="setExample(this)">כוכב מסתובב</span>
      <span class="example-chip" onclick="setExample(this)">עיגול שמתרחב ומתכווץ</span>
      <span class="example-chip" onclick="setExample(this)">טעינה מסתובבת</span>
      <span class="example-chip" onclick="setExample(this)">bouncing ball</span>
      <span class="example-chip" onclick="setExample(this)">checkmark animation</span>
    </div>

    <button id="generateBtn" onclick="generate()">✨ צור אנימציה</button>
  </div>

  <div class="spinner" id="spinner"></div>
  <div class="error-msg" id="errorMsg"></div>

  <div class="result-area" id="resultArea">
    <div class="preview-card">
      <div id="lottie-container"></div>
      <div class="action-row">
        <button class="action-btn" onclick="downloadJson()">הורד JSON</button>
        <button class="action-btn" onclick="copyJson()">העתק JSON</button>
        <button class="action-btn" onclick="regenerate()">צור מחדש</button>
      </div>
      <div class="json-section">
        <button class="json-toggle" onclick="toggleJson()">הצג / הסתר JSON גולמי</button>
        <pre id="jsonPre"></pre>
      </div>
    </div>
  </div>

  <script>
    let lottieInstance = null;
    let currentJson = null;
    let currentDesc = '';
    let imageBase64 = null;
    let imageMimeType = null;

    // ── Drag & Drop ──
    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) handleImageFile(file);
    });

    function handleImageFile(file) {
      if (!file) return;
      imageMimeType = file.type;
      const reader = new FileReader();
      reader.onload = e => {
        const dataUrl = e.target.result;
        // Extract base64 part only
        imageBase64 = dataUrl.split(',')[1];
        document.getElementById('previewImg').src = dataUrl;
        document.getElementById('previewWrap').style.display = 'block';
        document.getElementById('imgBadge').style.display = 'block';
        dropZone.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    function removeImage() {
      imageBase64 = null;
      imageMimeType = null;
      document.getElementById('previewWrap').style.display = 'none';
      document.getElementById('imgBadge').style.display = 'none';
      document.getElementById('imageInput').value = '';
      dropZone.style.display = 'block';
    }

    function setExample(el) {
      document.getElementById('desc').value = el.textContent;
    }

    async function generate() {
      const desc = document.getElementById('desc').value.trim();
      if (!desc) return;
      currentDesc = desc;

      setLoading(true);
      hideError();

      try {
        const body = { description: desc };
        if (imageBase64) {
          body.imageBase64 = imageBase64;
          body.imageMimeType = imageMimeType;
        }

        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'שגיאה לא ידועה');

        currentJson = data.lottie;
        renderAnimation(currentJson);
      } catch (err) {
        showError(err.message);
      } finally {
        setLoading(false);
      }
    }

    function renderAnimation(json) {
      const container = document.getElementById('lottie-container');
      container.innerHTML = '';
      if (lottieInstance) lottieInstance.destroy();

      lottieInstance = lottie.loadAnimation({
        container,
        renderer: 'svg',
        loop: true,
        autoplay: true,
        animationData: json
      });

      document.getElementById('jsonPre').textContent = JSON.stringify(json, null, 2);
      document.getElementById('resultArea').style.display = 'block';
      document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function toggleJson() {
      const pre = document.getElementById('jsonPre');
      pre.style.display = pre.style.display === 'none' ? 'block' : 'none';
    }

    function downloadJson() {
      if (!currentJson) return;
      const blob = new Blob([JSON.stringify(currentJson, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'animation.json';
      a.click();
    }

    function copyJson() {
      if (!currentJson) return;
      navigator.clipboard.writeText(JSON.stringify(currentJson, null, 2))
        .then(() => alert('JSON הועתק ללוח!'));
    }

    function regenerate() {
      if (currentDesc) {
        document.getElementById('desc').value = currentDesc;
        generate();
      }
    }

    function setLoading(on) {
      document.getElementById('spinner').style.display = on ? 'block' : 'none';
      document.getElementById('generateBtn').disabled = on;
      document.getElementById('generateBtn').textContent = on ? '⏳ יוצר אנימציה...' : '✨ צור אנימציה';
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = 'שגיאה: ' + msg;
      el.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorMsg').style.display = 'none';
    }

    document.getElementById('desc').addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.ctrlKey) generate();
    });
  </script>
</body>
</html>
