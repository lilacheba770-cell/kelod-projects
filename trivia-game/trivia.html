<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>חידון יום ההולדת - מדע וטבע</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #0c0818;
    --bg-2: #1c1033;
    --bg-3: #100a20;
    --panel: rgba(255,255,255,.055);
    --panel-strong: rgba(255,255,255,.09);
    --panel-border: rgba(255,255,255,.12);
    --purple: #8b5cf6;
    --purple-2: #6d28d9;
    --pink: #ff4d94;
    --gold: #ffd166;
    --gold-dark: #d99a2b;
    --green: #22c55e;
    --red: #ff5470;
    --text: #f6f3ff;
    --text-dim: #b6acd6;
    --text-faint: #8479a3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Rubik", "Segoe UI", Arial, sans-serif;
    color: var(--text);
    direction: rtl;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 60px;
    position: relative;
    overflow-x: hidden;
    background:
      radial-gradient(1100px 550px at 50% -8%, rgba(255,209,102,.16), transparent 60%),
      radial-gradient(900px 700px at 100% 110%, rgba(139,92,246,.28), transparent 60%),
      radial-gradient(900px 700px at -10% 100%, rgba(255,77,148,.18), transparent 55%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
    background-attachment: fixed;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 26px 26px;
    opacity: .35;
    pointer-events: none;
    z-index: 0;
  }

  .top-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel-strong); border: 1px solid var(--panel-border);
    padding: 7px 18px; border-radius: 999px; font-weight: 700; font-size: .78rem;
    letter-spacing: .06em; color: var(--gold); text-transform: uppercase;
    box-shadow: 0 4px 18px rgba(0,0,0,.25);
    margin-bottom: 14px; backdrop-filter: blur(8px);
    position: relative; z-index: 1;
  }
  .top-badge .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 10px 2px var(--gold); animation: pulseDot 1.6s ease-in-out infinite;
  }
  @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  h1 {
    text-align: center; margin: 4px 0 6px; font-size: 2.5rem; font-weight: 900;
    position: relative; z-index: 1;
    background: linear-gradient(90deg, #fff 10%, var(--gold) 55%, var(--pink) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 8px 30px rgba(255,209,102,.25);
    filter: drop-shadow(0 2px 10px rgba(0,0,0,.35));
  }
  .subtitle-row {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    margin-bottom: 26px; position: relative; z-index: 1;
  }
  .subtitle-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--panel-border);
    color: var(--text-dim); padding: 6px 14px; border-radius: 999px;
    font-size: .85rem; font-weight: 600; backdrop-filter: blur(8px);
  }

  .screen { width: 100%; max-width: 820px; display: none; flex-direction: column; align-items: center; position: relative; z-index: 1; }
  .screen.active { display: flex; animation: screenIn .45s ease; }
  @keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 26px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter: blur(18px);
    padding: 34px;
    width: 100%;
    overflow: hidden;
    transition: box-shadow .3s ease, border-color .3s ease;
  }
  .card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--purple), var(--pink), var(--gold));
  }
  .card.card--easy { border-color: rgba(34,197,94,.35); box-shadow: 0 24px 60px rgba(34,197,94,.12), inset 0 1px 0 rgba(255,255,255,.06); }
  .card.card--hard { border-color: rgba(255,84,112,.4); box-shadow: 0 24px 60px rgba(255,84,112,.14), inset 0 1px 0 rgba(255,255,255,.06); }

  .card h2 { margin-top: 0; text-align: center; font-size: 1.5rem; font-weight: 800; }

  /* Setup screen */
  .team-input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .team-swatch { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 4px rgba(255,255,255,.06), 0 0 14px 0 currentColor; }
  input[type="text"] {
    flex: 1; padding: 13px 16px; font-size: 1.05rem; border-radius: 13px;
    border: 1.5px solid var(--panel-border); outline: none; text-align: right;
    background: rgba(255,255,255,.05); color: var(--text); font-family: inherit;
    transition: border-color .2s ease, background .2s ease;
  }
  input[type="text"]::placeholder { color: var(--text-faint); }
  input[type="text"]:focus { border-color: var(--purple); background: rgba(255,255,255,.08); }
  .remove-btn {
    background: rgba(255,255,255,.07); border: 1px solid var(--panel-border); color: var(--text-dim);
    width: 34px; height: 34px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; flex-shrink: 0;
    transition: background .2s ease;
  }
  .remove-btn:hover { background: rgba(255,84,112,.25); color: #fff; }
  .setup-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; flex-wrap: wrap; }

  button { font-family: inherit; cursor: pointer; }
  .btn {
    border: none; border-radius: 14px; padding: 14px 22px; font-size: 1rem;
    font-weight: 700; transition: transform .12s ease, box-shadow .18s ease, filter .18s ease;
    position: relative;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: linear-gradient(135deg, var(--purple), var(--purple-2)); color: #fff; box-shadow: 0 10px 24px rgba(139,92,246,.4); }
  .btn-secondary { background: var(--panel-strong); color: var(--text); border: 1px solid var(--panel-border); }
  .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #3a2703; box-shadow: 0 10px 24px rgba(255,209,102,.35); }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; filter: none; }

  /* Score bar */
  .score-bar {
    display: flex; gap: 10px; flex-wrap: wrap; width: 100%; max-width: 820px;
    margin-bottom: 18px; justify-content: center;
  }
  .score-chip {
    position: relative; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 16px; padding: 12px 20px 10px; text-align: center; min-width: 128px;
    box-shadow: 0 8px 20px rgba(0,0,0,.3); backdrop-filter: blur(10px);
    overflow: hidden;
  }
  .score-chip::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--chip-color, var(--purple));
  }
  .score-chip.leading { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 10px 26px rgba(255,209,102,.25); }
  .score-chip .crown { position: absolute; top: -12px; right: 50%; transform: translateX(50%); font-size: 1.1rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
  .score-chip .rank-badge {
    position: absolute; top: 8px; inset-inline-start: 9px;
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(255,255,255,.08); color: var(--text-faint);
    font-size: .68rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .score-chip.leading .rank-badge { background: var(--gold); color: #3a2703; }
  .score-chip .t-name { font-size: .82rem; color: var(--text-dim); font-weight: 700; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score-chip .t-score { font-size: 1.7rem; font-weight: 900; color: var(--text); }

  /* Game screen */
  .progress-bar-wrap { position: relative; height: 7px; width: 100%; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; margin-bottom: 16px; }
  .progress-bar-fill { position: absolute; top: 0; inset-inline-start: 0; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--gold), var(--pink)); transition: width .5s cubic-bezier(.4,0,.2,1); }
  .progress { text-align: center; color: var(--text-dim); font-weight: 700; margin-bottom: 10px; font-size: .92rem; letter-spacing: .02em; }
  .badges { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
  .badge {
    padding: 6px 16px; border-radius: 999px; font-weight: 800; font-size: .82rem; color: #fff;
    box-shadow: 0 4px 12px rgba(0,0,0,.25); letter-spacing: .01em;
  }
  .badge.easy { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .badge.hard { background: linear-gradient(135deg, #ff5470, #d9264a); }
  .badge.cat { background: linear-gradient(135deg, var(--purple), var(--purple-2)); }
  .question-text {
    font-size: 1.55rem; font-weight: 800; text-align: center; line-height: 1.5;
    margin-bottom: 22px; min-height: 90px; display: flex; align-items: center; justify-content: center;
  }
  .question-text.anim { animation: qFadeIn .4s ease; }
  @keyframes qFadeIn { from { opacity: 0; transform: translateY(6px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .options-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px;
  }
  .option-item {
    display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.045);
    border: 1.5px solid var(--panel-border); border-radius: 15px; padding: 15px 17px;
    font-weight: 600; font-size: 1.03rem; transition: background .2s ease, border-color .2s ease, opacity .2s ease, transform .2s ease;
  }
  .option-item:hover { border-color: rgba(139,92,246,.5); transform: translateY(-1px); }
  .option-letter {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: #fff; font-weight: 800; font-size: .88rem;
    box-shadow: 0 4px 10px rgba(139,92,246,.4);
  }
  .option-item.correct {
    background: linear-gradient(135deg, rgba(34,197,94,.25), rgba(34,197,94,.12));
    border-color: var(--green); box-shadow: 0 0 0 1px var(--green), 0 8px 24px rgba(34,197,94,.25);
  }
  .option-item.correct .option-letter { background: var(--green); box-shadow: 0 4px 10px rgba(34,197,94,.5); }
  .option-item.dim { opacity: .45; }
  .answer-box {
    display: none; background: linear-gradient(135deg, rgba(34,197,94,.16), rgba(34,197,94,.06));
    border: 1.5px solid var(--green); border-radius: 15px;
    padding: 16px; text-align: center; font-size: 1.2rem; font-weight: 800; color: #7bf3ac;
    margin-bottom: 22px; box-shadow: 0 8px 22px rgba(34,197,94,.15);
  }
  .answer-box.show { display: block; animation: qFadeIn .35s ease; }
  .award-hint { display: none; text-align: center; color: var(--text-faint); font-size: .85rem; margin-bottom: 12px; }
  .award-hint.show { display: block; }
  .team-award-grid { display: none; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 6px; }
  .team-award-grid.show { display: flex; }
  .award-btn {
    background: var(--panel-strong); color: var(--text); border: 1.5px solid var(--panel-border);
    border-radius: 14px; padding: 12px 20px; font-weight: 700; font-size: .95rem;
    transition: transform .12s ease, filter .15s ease, background .15s ease, border-color .15s ease;
  }
  .award-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .award-btn.none-btn { background: rgba(255,255,255,.04); color: var(--text-faint); }
  .award-btn.selected {
    background: rgba(139,92,246,.28); border-color: var(--purple); color: #fff;
    box-shadow: 0 0 0 1px var(--purple), 0 6px 16px rgba(139,92,246,.3);
  }
  .award-btn.selected::before { content: "✓ "; }
  .award-btn.none-btn.selected {
    background: rgba(255,255,255,.14); border-color: var(--text-dim); color: #fff;
    box-shadow: 0 0 0 1px var(--text-dim);
  }
  .award-btn.chosen { background: linear-gradient(135deg, var(--green), #16a34a); color: #fff; border-color: var(--green); }
  .award-btn:disabled:not(.chosen) { opacity: .35; }
  .next-wrap { text-align: center; }

  /* End screen */
  #canvas-confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .trophy-hero { text-align: center; font-size: 3.4rem; margin-bottom: 4px; animation: trophyPulse 2.2s ease-in-out infinite; filter: drop-shadow(0 6px 18px rgba(255,209,102,.5)); }
  @keyframes trophyPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .winner-banner {
    text-align: center; font-size: 1.55rem; font-weight: 900;
    margin-bottom: 22px;
    background: linear-gradient(90deg, var(--gold), #fff 50%, var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .leaderboard { list-style: none; padding: 0; margin: 0 0 24px; }
  .leaderboard li {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 15px; padding: 15px 20px; margin-bottom: 10px;
    font-size: 1.08rem; font-weight: 700;
  }
  .leaderboard li.first {
    background: linear-gradient(90deg, rgba(255,209,102,.18), rgba(255,209,102,.05));
    border: 1.5px solid var(--gold); box-shadow: 0 8px 24px rgba(255,209,102,.2);
  }
  .medal { margin-left: 12px; font-size: 1.2rem; }
  .leaderboard .t-score-pill { background: rgba(255,255,255,.08); padding: 5px 14px; border-radius: 999px; font-size: .95rem; }

  @media (max-width: 480px) {
    .card { padding: 22px; border-radius: 20px; }
    h1 { font-size: 1.7rem; }
    .question-text { font-size: 1.22rem; }
    .options-grid { grid-template-columns: 1fr; }
    .score-chip { min-width: 100px; padding: 10px 14px 8px; }
  }
</style>
</head>
<body>

<div class="top-badge"><span class="dot"></span>תחרות חיה</div>
<h1>🎉 חידון יום ההולדת 🎂</h1>
<div class="subtitle-row">
  <span class="subtitle-chip">🔬 קטגוריה: מדע וטבע</span>
  <span class="subtitle-chip">🏆 תחרות קבוצות</span>
</div>

<canvas id="canvas-confetti"></canvas>

<!-- SETUP SCREEN -->
<div id="screen-setup" class="screen active">
  <div class="card">
    <h2>מי משחק היום?</h2>
    <div id="team-inputs"></div>
    <div class="setup-actions">
      <button class="btn btn-secondary" id="add-team-btn">➕ הוסיפו קבוצה</button>
      <button class="btn btn-primary" id="start-btn" style="flex:1;">🚀 התחילו לשחק!</button>
    </div>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="screen-game" class="screen">
  <div class="score-bar" id="score-bar"></div>
  <div class="card" id="game-card">
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="progress" id="progress-text"></div>
    <div class="badges">
      <span class="badge cat">🔬 מדע וטבע</span>
      <span class="badge" id="difficulty-badge"></span>
    </div>
    <div class="question-text" id="question-text"></div>
    <div class="options-grid" id="options-grid"></div>
    <div class="answer-box" id="answer-box"></div>

    <div style="text-align:center; margin-bottom:18px;">
      <button class="btn btn-gold" id="reveal-btn">🔍 הצג תשובה</button>
    </div>

    <div class="award-hint" id="award-hint">בחרו את כל הקבוצות שענו נכון (אפשר לבחור כמה קבוצות), ואז אשרו</div>
    <div class="team-award-grid" id="team-award-grid"></div>
    <div class="next-wrap" style="margin-bottom:12px;">
      <button class="btn btn-gold" id="confirm-award-btn" style="display:none;">✅ אשרו ניקוד</button>
    </div>

    <div class="next-wrap">
      <button class="btn btn-primary" id="next-btn" style="display:none;">▶ השאלה הבאה</button>
    </div>
  </div>
</div>

<!-- END SCREEN -->
<div id="screen-end" class="screen">
  <div class="card">
    <div class="trophy-hero">🏆</div>
    <div class="winner-banner" id="winner-banner"></div>
    <ol class="leaderboard" id="leaderboard"></ol>
    <button class="btn btn-primary btn-block" id="restart-btn">🔁 משחק חדש</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Question bank ----------
  // options: 4 choices; correctIndex points to the correct one within options
  const QUESTIONS = [
    { q: "איזו חיה היא המהירה ביותר ביבשה?", options: ["האריה", "הברדלס (הצ'יטה)", "הסוס", "הנמר"], correctIndex: 1, level: "easy" },
    { q: "מהו היסוד הכימי הנפוץ ביותר ביקום?", options: ["חמצן", "הליום", "מימן", "פחמן"], correctIndex: 2, level: "hard" },
    { q: "כמה רגליים יש לעכביש?", options: ["6", "8", "10", "4"], correctIndex: 1, level: "easy" },
    { q: "מהי מהירות האור בריק (בקירוב)?", options: ["כ-150,000 ק\"מ בשנייה", "כ-300 ק\"מ בשנייה", "כ-1,000,000 ק\"מ בשנייה", "כ-300,000 ק\"מ בשנייה"], correctIndex: 3, level: "hard" },
    { q: "מהו הכוכב הקרוב ביותר לשמש?", options: ["נוגה (ונוס)", "כדור הארץ", "כוכב חמה (מרקורי)", "מאדים"], correctIndex: 2, level: "easy" },
    { q: "מי ניסח את חוקי הכבידה הקלאסיים?", options: ["אלברט איינשטיין", "גלילאו גלילי", "אייזק ניוטון", "צ'רלס דרווין"], correctIndex: 2, level: "hard" },
    { q: "איזה איבר בגוף שואב את הדם דרך הגוף?", options: ["הריאות", "הלב", "הכבד", "המוח"], correctIndex: 1, level: "easy" },
    { q: "איזה איבר בגוף מייצר אינסולין?", options: ["הכבד", "הכליות", "הלבלב", "הטחול"], correctIndex: 2, level: "hard" },
    { q: "איזו חיה מכונה 'מלך החיות'?", options: ["הנמר", "הפיל", "האריה", "הדוב"], correctIndex: 2, level: "easy" },
    { q: "מהו הגז המרכיב את רוב האטמוספירה של כדור הארץ?", options: ["חמצן", "חנקן", "פחמן דו-חמצני", "מימן"], correctIndex: 1, level: "hard" },
    { q: "מאיזה חומר עשוי היהלום?", options: ["זכוכית", "כסף", "פחמן", "קוורץ"], correctIndex: 2, level: "easy" },
    { q: "מהו שם התהליך שבו צמחים הופכים אור שמש לאנרגיה?", options: ["נשימה תאית", "פוטוסינתזה", "אידוי", "תסיסה"], correctIndex: 1, level: "hard" },
    { q: "כמה עצמות יש בגוף האדם הבוגר (בקירוב)?", options: ["150", "206", "300", "120"], correctIndex: 1, level: "easy" },
    { q: "כמה כרומוזומים יש בתא אנושי רגיל?", options: ["23", "44", "46", "48"], correctIndex: 2, level: "hard" },
    { q: "איזה כוכב לכת מכונה 'כוכב הלכת האדום'?", options: ["צדק", "שבתאי", "נוגה", "מאדים"], correctIndex: 3, level: "easy" },
    { q: "מי ניסח את תורת האבולוציה בברירה טבעית?", options: ["גרגור מנדל", "לואי פסטר", "צ'רלס דרווין", "אייזק ניוטון"], correctIndex: 2, level: "hard" },
    { q: "מהי החיה הגדולה ביותר בעולם?", options: ["הפיל האפריקאי", "הלוויתן הכחול", "הג'ירפה", "כריש הלבן הגדול"], correctIndex: 1, level: "easy" },
    { q: "מהי התופעה הגורמת להיווצרות צבעי הקשת?", options: ["קיטוב מגנטי", "יינון האוויר", "שבירה ופיזור של אור לבן", "החזרת קרינה קוסמית"], correctIndex: 2, level: "hard" },
    { q: "כמה לבבות יש לתמנון?", options: ["1", "2", "3", "4"], correctIndex: 2, level: "easy" },
    { q: "מהו קוטרו של כדור הארץ בקירוב?", options: ["כ-6,371 ק\"מ", "כ-12,742 ק\"מ", "כ-40,000 ק\"מ", "כ-150,000,000 ק\"מ"], correctIndex: 1, level: "hard" },
    { q: "מהו הגז שאנו נושמים כדי לחיות?", options: ["חנקן", "פחמן דו-חמצני", "חמצן", "הליום"], correctIndex: 2, level: "easy" },
    { q: "מהי היחידה הבסיסית ביותר של כל חומר?", options: ["התא", "המולקולה", "האלקטרון", "האטום"], correctIndex: 3, level: "hard" },
    { q: "כמה זמן לוקח לכדור הארץ להקיף פעם אחת את השמש?", options: ["כחודש", "כשנה אחת (כ-365 ימים)", "כיממה אחת", "כעשר שנים"], correctIndex: 1, level: "easy" },
    { q: "מהו שמה של התיאוריה שפרסם איינשטיין על מרחב, זמן וכבידה?", options: ["תורת הקוונטים", "תורת האבולוציה", "תורת המיתרים", "תורת היחסות"], correctIndex: 3, level: "hard" },
    { q: "כמה שיניים יש בממוצע לכריש?", options: ["32 שיניים", "20 שיניים", "מאות שיניים (הן מתחלפות כל הזמן)", "אין לכריש שיניים"], correctIndex: 2, level: "easy" },
    { q: "מהו שם הכוח המחזיק את האלקטרונים סביב גרעין האטום?", options: ["כוח הכבידה", "הכוח הגרעיני החזק", "הכוח הגרעיני החלש", "הכוח האלקטרומגנטי"], correctIndex: 3, level: "hard" }
  ];
  const OPTION_LETTERS = ["א׳", "ב׳", "ג׳", "ד׳"];

  const POINTS = { easy: 10, hard: 20 };
  const TEAM_COLORS = ["#ff5da2", "#3ec9a7", "#8b5cf6", "#ffb020"];
  const CONFETTI_COLORS = [...TEAM_COLORS, "#ffd166"];

  // ---------- State ----------
  let teams = [];
  let currentIndex = 0;
  let awarded = false;
  let confettiRunning = false;
  let selectedTeamIdxs = new Set();
  let noneChosen = false;

  // ---------- Elements ----------
  const screens = {
    setup: document.getElementById("screen-setup"),
    game: document.getElementById("screen-game"),
    end: document.getElementById("screen-end")
  };
  const teamInputsEl = document.getElementById("team-inputs");
  const addTeamBtn = document.getElementById("add-team-btn");
  const startBtn = document.getElementById("start-btn");
  const scoreBarEl = document.getElementById("score-bar");
  const gameCard = document.getElementById("game-card");
  const progressFill = document.getElementById("progress-fill");
  const progressText = document.getElementById("progress-text");
  const difficultyBadge = document.getElementById("difficulty-badge");
  const questionText = document.getElementById("question-text");
  const optionsGrid = document.getElementById("options-grid");
  const answerBox = document.getElementById("answer-box");
  const revealBtn = document.getElementById("reveal-btn");
  const awardHint = document.getElementById("award-hint");
  const teamAwardGrid = document.getElementById("team-award-grid");
  const confirmAwardBtn = document.getElementById("confirm-award-btn");
  const nextBtn = document.getElementById("next-btn");
  const winnerBanner = document.getElementById("winner-banner");
  const leaderboardEl = document.getElementById("leaderboard");
  const restartBtn = document.getElementById("restart-btn");

  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.remove("active"));
    screens[name].classList.add("active");
  }

  // ---------- Setup screen ----------
  function renderTeamInputs() {
    teamInputsEl.innerHTML = "";
    const count = teamInputsEl.dataset.count ? Number(teamInputsEl.dataset.count) : 2;
    for (let i = 0; i < count; i++) {
      const row = document.createElement("div");
      row.className = "team-input-row";
      row.innerHTML = `
        <span class="team-swatch" style="background:${TEAM_COLORS[i]}; color:${TEAM_COLORS[i]}"></span>
        <input type="text" placeholder="שם קבוצה ${i + 1}" maxlength="20" value="">
        ${count > 2 ? '<button type="button" class="remove-btn" data-idx="' + i + '">✕</button>' : ''}
      `;
      teamInputsEl.appendChild(row);
    }
    teamInputsEl.dataset.count = count;
    addTeamBtn.disabled = count >= 4;
    teamInputsEl.querySelectorAll(".remove-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        teamInputsEl.dataset.count = Math.max(2, count - 1);
        renderTeamInputs();
      });
    });
  }

  addTeamBtn.addEventListener("click", () => {
    const count = Number(teamInputsEl.dataset.count || 2);
    if (count < 4) {
      teamInputsEl.dataset.count = count + 1;
      renderTeamInputs();
    }
  });

  startBtn.addEventListener("click", () => {
    const inputs = teamInputsEl.querySelectorAll("input[type=text]");
    teams = Array.from(inputs).map((inp, i) => ({
      name: inp.value.trim() || `קבוצה ${i + 1}`,
      score: 0,
      color: TEAM_COLORS[i]
    }));
    currentIndex = 0;
    renderScoreBar();
    renderQuestion();
    showScreen("game");
  });

  // ---------- Score bar ----------
  function renderScoreBar() {
    const maxScore = Math.max(...teams.map(t => t.score));
    const sorted = [...teams].sort((a, b) => b.score - a.score);
    scoreBarEl.innerHTML = sorted.map((t, i) => `
      <div class="score-chip ${t.score === maxScore && maxScore > 0 ? 'leading' : ''}" style="--chip-color:${t.color}">
        <span class="rank-badge">${i + 1}</span>
        ${t.score === maxScore && maxScore > 0 ? '<span class="crown">👑</span>' : ''}
        <div class="t-name">${t.name}</div>
        <div class="t-score">${t.score}</div>
      </div>
    `).join("");
  }

  // ---------- Game screen ----------
  function renderQuestion() {
    const item = QUESTIONS[currentIndex];
    awarded = false;
    progressFill.style.width = ((currentIndex) / QUESTIONS.length * 100) + "%";
    progressText.textContent = `שאלה ${currentIndex + 1} מתוך ${QUESTIONS.length}`;
    difficultyBadge.textContent = item.level === "easy" ? `קל (10 נק')` : `קשה (20 נק')`;
    difficultyBadge.className = "badge " + item.level;
    gameCard.classList.toggle("card--easy", item.level === "easy");
    gameCard.classList.toggle("card--hard", item.level === "hard");
    questionText.textContent = item.q;
    questionText.classList.remove("anim");
    void questionText.offsetWidth;
    questionText.classList.add("anim");
    optionsGrid.innerHTML = item.options.map((opt, i) => `
      <div class="option-item" data-idx="${i}">
        <span class="option-letter">${OPTION_LETTERS[i]}</span>
        <span>${opt}</span>
      </div>
    `).join("");
    answerBox.textContent = "";
    answerBox.classList.remove("show");
    revealBtn.style.display = "inline-block";
    revealBtn.disabled = false;
    awardHint.classList.remove("show");
    teamAwardGrid.classList.remove("show");
    teamAwardGrid.innerHTML = "";
    confirmAwardBtn.style.display = "none";
    nextBtn.style.display = "none";
  }

  revealBtn.addEventListener("click", () => {
    const item = QUESTIONS[currentIndex];
    optionsGrid.querySelectorAll(".option-item").forEach(el => {
      if (Number(el.dataset.idx) === item.correctIndex) {
        el.classList.add("correct");
      } else {
        el.classList.add("dim");
      }
    });
    answerBox.textContent = "✅ התשובה הנכונה: " + OPTION_LETTERS[item.correctIndex] + " " + item.options[item.correctIndex];
    answerBox.classList.add("show");
    revealBtn.style.display = "none";
    buildAwardButtons();
  });

  function buildAwardButtons() {
    teamAwardGrid.innerHTML = "";
    selectedTeamIdxs = new Set();
    noneChosen = false;
    teams.forEach((t, idx) => {
      const b = document.createElement("button");
      b.className = "award-btn";
      b.style.setProperty("--team-color", t.color);
      b.textContent = `${t.name} ענו נכון`;
      b.addEventListener("click", () => toggleTeamSelection(idx, b));
      teamAwardGrid.appendChild(b);
    });
    const noneBtn = document.createElement("button");
    noneBtn.className = "award-btn none-btn";
    noneBtn.textContent = "אף אחד לא ידע";
    noneBtn.addEventListener("click", () => toggleNoneSelection(noneBtn));
    teamAwardGrid.appendChild(noneBtn);
    teamAwardGrid.classList.add("show");
    awardHint.classList.add("show");
    confirmAwardBtn.style.display = "none";
  }

  function toggleTeamSelection(idx, btn) {
    if (awarded) return;
    noneChosen = false;
    const noneBtnEl = teamAwardGrid.querySelector(".none-btn");
    if (noneBtnEl) noneBtnEl.classList.remove("selected");
    if (selectedTeamIdxs.has(idx)) {
      selectedTeamIdxs.delete(idx);
      btn.classList.remove("selected");
    } else {
      selectedTeamIdxs.add(idx);
      btn.classList.add("selected");
    }
    updateConfirmVisibility();
  }

  function toggleNoneSelection(btn) {
    if (awarded) return;
    noneChosen = !noneChosen;
    btn.classList.toggle("selected", noneChosen);
    if (noneChosen) {
      selectedTeamIdxs.clear();
      teamAwardGrid.querySelectorAll(".award-btn:not(.none-btn)").forEach(b => b.classList.remove("selected"));
    }
    updateConfirmVisibility();
  }

  function updateConfirmVisibility() {
    confirmAwardBtn.style.display = (selectedTeamIdxs.size > 0 || noneChosen) ? "inline-block" : "none";
  }

  confirmAwardBtn.addEventListener("click", () => {
    if (awarded) return;
    awarded = true;
    const item = QUESTIONS[currentIndex];
    selectedTeamIdxs.forEach(idx => {
      teams[idx].score += POINTS[item.level];
    });
    teamAwardGrid.querySelectorAll(".award-btn").forEach(btn => {
      btn.disabled = true;
      if (btn.classList.contains("selected")) btn.classList.add("chosen");
    });
    awardHint.classList.remove("show");
    confirmAwardBtn.style.display = "none";
    renderScoreBar();
    nextBtn.style.display = "inline-block";
  });

  nextBtn.addEventListener("click", () => {
    currentIndex++;
    if (currentIndex >= QUESTIONS.length) {
      progressFill.style.width = "100%";
      renderEndScreen();
      showScreen("end");
    } else {
      renderQuestion();
    }
  });

  // ---------- End screen ----------
  function renderEndScreen() {
    const sorted = [...teams].sort((a, b) => b.score - a.score);
    const topScore = sorted[0].score;
    const winners = sorted.filter(t => t.score === topScore);
    const uniqueScores = [...new Set(sorted.map(t => t.score))];

    winnerBanner.innerHTML = winners.length > 1
      ? `תיקו מרשים בין ${winners.map(w => w.name).join(" ו-")}!`
      : `מזל טוב, ${winners[0].name} ניצחו!`;

    leaderboardEl.innerHTML = sorted.map(t => {
      const rank = uniqueScores.indexOf(t.score);
      const medal = rank === 0 ? "🥇" : rank === 1 ? "🥈" : rank === 2 ? "🥉" : "🎗️";
      return `<li class="${rank === 0 ? 'first' : ''}"><span><span class="medal">${medal}</span>${t.name}</span><span class="t-score-pill">${t.score} נק'</span></li>`;
    }).join("");

    startConfetti();
  }

  restartBtn.addEventListener("click", () => {
    stopConfetti();
    teamInputsEl.dataset.count = 2;
    renderTeamInputs();
    showScreen("setup");
  });

  // ---------- Confetti ----------
  const canvas = document.getElementById("canvas-confetti");
  const ctx = canvas.getContext("2d");
  let particles = [];
  let confettiFrame = null;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function startConfetti() {
    particles = Array.from({ length: 150 }, () => ({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height,
      size: 6 + Math.random() * 6,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      speed: 2 + Math.random() * 3,
      drift: (Math.random() - 0.5) * 2,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 8
    }));
    confettiRunning = true;
    cancelAnimationFrame(confettiFrame);
    tickConfetti();
  }

  function stopConfetti() {
    confettiRunning = false;
    cancelAnimationFrame(confettiFrame);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function tickConfetti() {
    if (!confettiRunning) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.y += p.speed;
      p.x += p.drift;
      p.rotation += p.rotSpeed;
      if (p.y > canvas.height + 20) {
        p.y = -20;
        p.x = Math.random() * canvas.width;
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    });
    confettiFrame = requestAnimationFrame(tickConfetti);
  }

  // ---------- Init ----------
  renderTeamInputs();
})();
</script>
</body>
</html>
